---
- name: Install nginx on EC2 servers
  hosts: aws_ec2
  become: true
  remote_user: ubuntu
  vars:
    ansible_ssh_private_key_file: ~/.ssh/sindhu-key.pem
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  tasks:
    - name: update apt cache
      apt:
        update_cache: yes

    - name: install nginx
      apt:
        name: nginx
        state: present

    - name: start nginx
      service:
        name: nginx
        state: started
